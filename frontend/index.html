<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGrade AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Order matters: config first, then the router (which loads the screens' HTML and JS) -->
    <script src="javascript/config.js" defer></script>
    <script src="javascript/router.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
</head>

<body>
    <!-- ONE shared icon sprite for all screens -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="icon-upload" viewBox="0 0 24 24">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
            <path d="M14 3v5h5" />
            <path d="M12 17v-6" />
            <path d="m9.5 13 2.5-2.5 2.5 2.5" />
        </symbol>
        <symbol id="icon-upload-multi" viewBox="0 0 24 24">
            <path d="M9 7h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" />
            <path d="M5 17V6a2 2 0 0 1 2-2h8" />
            <path d="M13 18v-5" />
            <path d="m10.8 14.8 2.2-2.2 2.2 2.2" />
        </symbol>
        <symbol id="icon-file" viewBox="0 0 24 24">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
            <path d="M14 3v5h5" />
            <path d="M9 13h6M9 17h4" />
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24">
            <path d="M6 6l12 12M18 6 6 18" />
        </symbol>
        <symbol id="icon-check" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path d="m8 12.5 2.8 2.8L16 10" />
        </symbol>
        <symbol id="icon-paperclip" viewBox="0 0 24 24">
            <path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7" />
        </symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24">
            <path d="M5 12h14M13 6l6 6-6 6" />
        </symbol>
        <symbol id="icon-info" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v5" />
            <path d="M12 7.5v.01" />
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="icon-cap" viewBox="0 0 24 24">
            <path d="M12 5 2 10l10 5 10-5z" />
            <path d="M6 12.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-3.5" />
            <path d="M22 10v5" />
        </symbol>
        <symbol id="icon-step-upload" viewBox="0 0 24 24">
            <path d="M12 16V4" />
            <path d="m7.5 8.5 4.5-4.5 4.5 4.5" />
            <path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" />
        </symbol>
        <symbol id="icon-step-ocr" viewBox="0 0 24 24">
            <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" />
            <path d="M8 9h8M8 12h8M8 15h5" />
        </symbol>
        <symbol id="icon-step-format" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h10M4 18h14" />
        </symbol>
        <symbol id="icon-step-grading" viewBox="0 0 24 24">
            <path d="m4 16 11-11 4 4L8 20H4z" />
            <path d="m12 8 4 4" />
        </symbol>
        <symbol id="icon-step-marks" viewBox="0 0 24 24">
            <rect x="5" y="3" width="14" height="18" rx="2" />
            <path d="M9 8h6M9 12h6M9 16h3" />
        </symbol>
        <symbol id="icon-step-review" viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="3.5" />
            <path d="M2.5 20a6.5 6.5 0 0 1 13 0" />
            <circle cx="17" cy="9" r="2.5" />
            <path d="M17.5 14a5 5 0 0 1 4 5" />
        </symbol>
        <symbol id="icon-label" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <path d="M8 9h8M8 13h8M8 17h4" />
        </symbol>
        <symbol id="icon-check-square" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <path d="m8.5 12.5 2.5 2.5 4.5-5" />
        </symbol>
        <symbol id="icon-nested" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="3" />
            <path d="M8 9h8M11 13h5M11 17h5" />
        </symbol>
        <symbol id="icon-warning" viewBox="0 0 24 24">
            <path d="M12 4 2.5 20h19z" />
            <path d="M12 10v5" />
            <path d="M12 17.5v.01" />
        </symbol>
        <symbol id="icon-code" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="3" />
            <path d="m9 9-3 3 3 3M15 9l3 3-3 3M13 8l-2 8" />
        </symbol>
        <symbol id="icon-external" viewBox="0 0 24 24">
            <path d="M7 17 17 7M9 7h8v8" />
        </symbol>
    </svg>

    <!-- ================= NAVBAR (outside every screen, so it never disappears) ================= -->
    <header class="navbar" id="navbar">
        <a href="#home" class="navbar-logo" id="navbar-logo">
            <svg class="navbar-logo-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <path d="M16 8 2 14.5 16 21l14-6.5z" fill="#1f3a5f" />
                <path d="M8 17.5v5c0 1.8 3.6 3.5 8 3.5s8-1.7 8-3.5v-5L16 21z" fill="#2d5a8c" />
                <path d="M30 14.5V22" stroke="#1f3a5f" stroke-width="1.6" stroke-linecap="round" />
                <path d="M25 3l.9 2.1L28 6l-2.1.9L25 9l-.9-2.1L22 6l2.1-.9z" fill="#f2a65a" />
            </svg>
            <span class="navbar-logo-text">AutoGrade AI</span>
        </a>
        <nav aria-label="Main navigation">
            <!-- href is a #hash and data-screen is read by router.js. The router sets "is-active". -->
            <ul class="navbar-links" id="navbar-links">
                <li><a href="#home" class="navbar-link" data-screen="home" id="nav-home">Home</a></li>
                <li><a href="#grading" class="navbar-link" data-screen="grading" id="nav-grading-scheme">Grading Scheme</a></li>
                <li><a href="#about" class="navbar-link" data-screen="about" id="nav-about">About Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- ================= SCREENS (filled by router.js from the files in pages/) ================= -->
    <main id="app">
        <section class="main-content" id="home-screen" hidden></section>
        <section class="main-content main-content-narrow" id="grading-scheme-screen" hidden></section>
        <section class="main-content main-content-narrow" id="about-screen" hidden></section>
    </main>
</body>

</html>
